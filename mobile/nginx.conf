# Static hosting for the Flutter web demo builds. __API_ORIGIN__ / __API_WS_ORIGIN__ are substituted at image build time.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  # geolocation is needed by the apps; everything else is off
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
  # CanvasKit needs wasm-unsafe-eval; tiles come from OpenStreetMap; the API and its websocket are the only network peers.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' __API_ORIGIN__ __API_WS_ORIGIN__ https://tile.openstreetmap.org https://*.tile.openstreetmap.org; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

  location / { try_files $uri /index.html; }
}
