# Static hosting for the admin SPA. __API_ORIGIN__ / __API_WS_ORIGIN__ are substituted at image build time.
server {
  listen 5173;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # NB: nginx only inherits add_header into a location that defines none of its own, so keep every header here.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
  # Terminate TLS in front of this container and send Strict-Transport-Security there (it is ignored over plain http).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' __API_ORIGIN__ __API_WS_ORIGIN__; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

  location /assets/ { expires 1y; try_files $uri =404; }
  location / { add_header Cache-Control "no-store" always; try_files $uri /index.html; }
}
