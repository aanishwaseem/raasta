name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: raasta
          POSTGRES_PASSWORD: raasta_dev_password
          POSTGRES_DB: raasta_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U raasta -d raasta_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://raasta:raasta_dev_password@localhost:5432/raasta_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y redis-tools
        working-directory: .
      # backend/test/ai-service.e2e-spec.ts starts the real Python AI service
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r ai-service/requirements.txt
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/database/migrate.js
      - run: npm run test:e2e

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [raasta_core, passenger_app, driver_app]
    defaults:
      run:
        working-directory: mobile/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  docker:
    name: docker compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images and start the stack
        run: docker compose --profile web up -d --build
      - name: Wait for the API and AI service
        run: |
          for i in $(seq 1 60); do
            curl -sf localhost:3000/health/ready && break
            sleep 3
          done
          curl -sf localhost:3000/health/ready
          for url in localhost:5173 localhost:8080 localhost:8081; do curl -sf -o /dev/null "$url"; done
      - name: Sign in as the seeded rider through the running stack
        run: |
          curl -sf -X POST localhost:3000/api/v1/auth/login -H 'content-type: application/json' \
            -d '{"identifier":"bilal@raasta.test","password":"Passw0rd!test","device":{"deviceId":"ci-device-0001","platform":"android"}}' \
            | grep -q accessToken
      - name: Show logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --tail=80
      - run: docker compose --profile web down -v
        if: always()
